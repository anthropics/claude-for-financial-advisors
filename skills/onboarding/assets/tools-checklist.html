<h2 class="sr-only">Form asking which tools the advisor's firm uses, in 11 groups.</h2>
<form class="elicit">
  <div class="elicit-header">
    <span>Which tools do you want to connect?</span>
  </div>
  <div class="elicit-body">

    <div class="elicit-group">
      <label class="elicit-question">CRM &amp; prospecting</label>
      <div class="elicit-pills" data-name="crm_and_prospecting" data-multi="true">
        <button type="button" class="elicit-pill" data-value="FINNY">FINNY</button>
        <button type="button" class="elicit-pill" data-value="Redtail CRM">Redtail CRM</button>
        <button type="button" class="elicit-pill" data-value="Salesforce">Salesforce</button>
        <button type="button" class="elicit-pill" data-value="Wealthbox">Wealthbox</button>
      </div>
    </div>

    <div class="elicit-group">
      <label class="elicit-question">Custody &amp; cash</label>
      <div class="elicit-pills" data-name="custody_and_cash" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Flourish Financial">Flourish Financial</button>
      </div>
    </div>

    <div class="elicit-group">
      <label class="elicit-question">Portfolio management</label>
      <div class="elicit-pills" data-name="portfolio_management" data-multi="true">
        <button type="button" class="elicit-pill" data-value="55ip">55ip</button>
        <button type="button" class="elicit-pill" data-value="Addepar">Addepar</button>
        <button type="button" class="elicit-pill" data-value="Envestnet/Tamarac">Envestnet/Tamarac</button>
        <button type="button" class="elicit-pill" data-value="Orion Connect">Orion Connect</button>
      </div>
    </div>

    <div class="elicit-group">
      <label class="elicit-question">Alternatives</label>
      <div class="elicit-pills" data-name="alternatives" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Addepar">Addepar</button>
        <button type="button" class="elicit-pill" data-value="CAIS">CAIS</button>
        <button type="button" class="elicit-pill" data-value="iCapital">iCapital</button>
      </div>
    </div>

    <div class="elicit-group">
      <label class="elicit-question">Model portfolios</label>
      <div class="elicit-pills" data-name="model_portfolios" data-multi="true">
        <button type="button" class="elicit-pill" data-value="BlackRock Advisor Center">BlackRock Advisor Center</button>
        <button type="button" class="elicit-pill" data-value="Invesco">Invesco</button>
      </div>
    </div>

    <div class="elicit-group">
      <label class="elicit-question">Portfolio analytics &amp; risk</label>
      <div class="elicit-pills" data-name="portfolio_analytics_and_risk" data-multi="true">
        <button type="button" class="elicit-pill" data-value="BlackRock Advisor Center">BlackRock Advisor Center</button>
        <button type="button" class="elicit-pill" data-value="MSCI">MSCI</button>
      </div>
    </div>

    <div class="elicit-group">
      <label class="elicit-question">Investment research, market &amp; fund data</label>
      <div class="elicit-pills" data-name="investment_research_market_and_fund_data" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Daloopa">Daloopa</button>
        <button type="button" class="elicit-pill" data-value="FactSet">FactSet</button>
        <button type="button" class="elicit-pill" data-value="Franklin Templeton">Franklin Templeton</button>
        <button type="button" class="elicit-pill" data-value="Morningstar">Morningstar</button>
        <button type="button" class="elicit-pill" data-value="MSCI">MSCI</button>
        <button type="button" class="elicit-pill" data-value="S&amp;P">S&amp;P</button>
      </div>
    </div>

    <div class="elicit-group">
      <label class="elicit-question">Financial, tax &amp; estate planning</label>
      <div class="elicit-pills" data-name="financial_tax_and_estate_planning" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Conquest Planning">Conquest Planning</button>
        <button type="button" class="elicit-pill" data-value="MoneyGuide">MoneyGuide</button>
        <button type="button" class="elicit-pill" data-value="Wealth.com">Wealth.com</button>
      </div>
    </div>

    <div class="elicit-group">
      <label class="elicit-question">Meeting intelligence</label>
      <div class="elicit-pills" data-name="meeting_intelligence" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Jump">Jump</button>
        <button type="button" class="elicit-pill" data-value="Nevis">Nevis</button>
        <button type="button" class="elicit-pill" data-value="Zocks">Zocks</button>
      </div>
    </div>

    <div class="elicit-group">
      <label class="elicit-question">Email, calendar &amp; collaboration</label>
      <div class="elicit-pills" data-name="email_calendar_and_collaboration" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Gmail">Gmail</button>
        <button type="button" class="elicit-pill" data-value="Google Calendar">Google Calendar</button>
        <button type="button" class="elicit-pill" data-value="Microsoft 365">Microsoft 365</button>
        <button type="button" class="elicit-pill" data-value="Slack">Slack</button>
        <button type="button" class="elicit-pill" data-value="Zoom">Zoom</button>
      </div>
    </div>

    <div class="elicit-group">
      <label class="elicit-question">Documents &amp; firm data</label>
      <div class="elicit-pills" data-name="documents_and_firm_data" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Box">Box</button>
        <button type="button" class="elicit-pill" data-value="Dropbox">Dropbox</button>
        <button type="button" class="elicit-pill" data-value="Google Drive">Google Drive</button>
        <button type="button" class="elicit-pill" data-value="Microsoft 365">Microsoft 365</button>
        <button type="button" class="elicit-pill" data-value="Snowflake">Snowflake</button>
      </div>
    </div>

    <div class="elicit-group">
      <label class="elicit-question">Anything else your firm uses that isn't listed?</label>
      <textarea class="elicit-textarea" data-name="something_else" placeholder="Type the names of any other tools"></textarea>
    </div>

  </div>
  <div class="elicit-footer">
    <button type="button" class="elicit-submit">Continue</button>
  </div>
</form>
